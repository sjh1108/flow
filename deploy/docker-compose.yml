# Deployment stack for the existing OCI instance.
#
# Designed to sit alongside another project already running on the same box:
#   * a distinct compose project name (see the `name:` key below)
#   * MySQL is NOT published to the host, so it cannot clash with an existing
#     MySQL on 3306 and is not reachable from outside the compose network
#   * Caddy is optional and only needed if this is the machine's TLS terminator;
#     if the other project already owns 80/443, drop the caddy service and point
#     the existing reverse proxy at the app container instead.
#
# Copy .env.example to .env and fill it in before running.

name: extguard

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: extguard
      # Read by mysql-init/01-users.sh when it creates the two accounts. Keeping
      # them here rather than in the SQL means no password is ever committed.
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  # Stage 1 of 3: bring the schema up to date, then exit.
  #
  # This is the same image as `app`, run under the `migrate` profile so it
  # migrates instead of serving. Same image on purpose: the Flyway version is
  # then the one the application was built against, the migrations travel inside
  # the jar, and it is built on this machine so the architecture matches (see
  # the ARM64 note in backend/Dockerfile).
  #
  # It exists so the application container does not have to. Flyway used to run
  # inside the app with SPRING_FLYWAY_USER/PASSWORD set to the migrator, which
  # meant the app held credentials for an account with ALL PRIVILEGES -- anything
  # able to read its environment could undo every restriction in grants.sql.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: migrate
      # The migrator is this container's only account. Flyway uses the ordinary
      # datasource, so it needs no credentials of its own.
      DB_URL: jdbc:mysql://mysql:3306/extguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: extguard_migrator
      DB_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
    deploy:
      resources:
        limits:
          memory: 768M

  # Stage 2 of 3: narrow the application account, then exit.
  #
  # Table-level grants need the tables, so this cannot run with the database's
  # init scripts -- it waits for `migrate`. It used to be a manual command the
  # README admitted was easy to forget; forgetting it left the application
  # account with database-wide rights and nothing said so.
  #
  # Re-applied on every deployment, which is the point: the grants are asserted
  # rather than assumed.
  grants:
    image: mysql:8.4
    restart: "no"
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./grants.sql:/grants.sql:ro
    command: >
      sh -c 'mysql -h mysql -uroot -p"$$MYSQL_ROOT_PASSWORD" < /grants.sql'

  # Stage 3 of 3: the application. Holds one account, its own.
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      grants:
        condition: service_completed_successfully
    environment:
      # Migration is somebody else's job now. If the schema were somehow behind,
      # Hibernate's `ddl-auto: validate` refuses to start rather than running on
      # a shape it does not recognise.
      SPRING_FLYWAY_ENABLED: "false"
      # A restricted account that cannot insert or delete rows in
      # fixed_extension_state. See grants.sql.
      DB_URL: jdbc:mysql://mysql:3306/extguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: extguard_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      EXTGUARD_ADMIN_TOKEN: ${EXTGUARD_ADMIN_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STORAGE_ROOT: /var/lib/extguard/files
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
    volumes:
      - uploads:/var/lib/extguard/files
    ports:
      # Bound to loopback only: Caddy (or an existing reverse proxy) fronts it.
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 768M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["with-tls"]
    depends_on:
      - app
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
