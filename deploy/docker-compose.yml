# Deployment stack for the existing OCI instance.
#
# Designed to sit alongside another project already running on the same box:
#   * a distinct compose project name (see the `name:` key below)
#   * MySQL is NOT published to the host, so it cannot clash with an existing
#     MySQL on 3306 and is not reachable from outside the compose network
#   * Caddy is optional and only needed if this is the machine's TLS terminator;
#     if the other project already owns 80/443, drop the caddy service and point
#     the existing reverse proxy at the app container instead.
#
# Copy .env.example to .env and fill it in before running.

name: extguard

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: extguard
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Flyway connects as the migration account, which owns the schema.
      SPRING_FLYWAY_USER: extguard_migrator
      SPRING_FLYWAY_PASSWORD: ${MIGRATOR_PASSWORD:?set MIGRATOR_PASSWORD in .env}
      # The application connects as a restricted account that cannot insert or
      # delete rows in fixed_extension_state. See mysql-init/02-grants.sql.
      DB_URL: jdbc:mysql://mysql:3306/extguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: extguard_app
      DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      EXTGUARD_ADMIN_TOKEN: ${EXTGUARD_ADMIN_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      STORAGE_ROOT: /var/lib/extguard/files
      JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC
    volumes:
      - uploads:/var/lib/extguard/files
    ports:
      # Bound to loopback only: Caddy (or an existing reverse proxy) fronts it.
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 768M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["with-tls"]
    depends_on:
      - app
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
