# Local development without MySQL or Docker.
#
#   ./gradlew bootRun --args='--spring.profiles.active=dev'
#
# Uses the same Flyway migrations as production against an in-memory H2 in MySQL
# compatibility mode, so the CHECK constraints behave the same way. Data is lost
# on restart, which is the point for a scratch environment.
spring:
  datasource:
    url: jdbc:h2:mem:extguard;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

extguard:
  storage:
    root: ${STORAGE_ROOT:./data/uploads}
  cors:
    allowed-origins: >-
      http://localhost:5173,http://localhost:3000,http://localhost:4173,
      http://127.0.0.1:5173,http://127.0.0.1:3000,http://127.0.0.1:8081,http://localhost:8081

logging:
  level:
    com.flow.extguard: DEBUG
