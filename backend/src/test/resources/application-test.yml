# H2 in MySQL compatibility mode.
#
# Flyway runs the real production migrations here rather than letting Hibernate
# generate a schema, so the CHECK constraints that protect the fixed extensions
# are genuinely exercised by the test suite. H2 enforces CHECK constraints, which
# is what makes this substitution worth doing.
spring:
  datasource:
    url: jdbc:h2:mem:extguard;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 210MB

extguard:
  storage:
    root: ${java.io.tmpdir}/extguard-test
    max-file-size: 20MB
    max-files-per-request: 10
  policy:
    max-custom-extensions: 200
    max-extension-length: 20
    check-full-extension-chain: true
  admin:
    token: ""
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.flow.extguard: DEBUG
